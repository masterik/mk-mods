name: release

on:
  push:
    tags:
      - "*-v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: GitHub Release, notes from the theme's commits since its previous tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          theme=${TAG%-v*}
          prev=$(git describe --tags --abbrev=0 --match "$theme-v[0-9]*.[0-9]*.[0-9]*" "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          notes=$(git log "$range" --no-merges --format='- %s (%h)' -- "$theme/")
          gh release create "$TAG" --title "$theme ${TAG##*-v}" --notes "${notes:-No changes under $theme/.}"
