name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: GitHub Release, notes from the commits since the previous tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)
          notes=$(git log "${prev:+$prev..}$TAG" --no-merges --format='- %s (%h)' | grep -v '^- chore(release):' || true)
          gh release create "$TAG" --title "$TAG" --notes "${notes:-No changes.}"
